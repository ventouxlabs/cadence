name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=cadence --cov-fail-under=80

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e --browser chromium -o addopts=""
      # The same script `make screenshots` runs. It seeds its own throwaway databases, so this
      # never touches anything real, and the artifact is how a reviewer sees the screens without
      # checking the branch out. `if: always()` so a failing assertion still leaves the pictures
      # of what it was looking at.
      - name: Screenshots
        run: uv run python scripts/screenshots.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/
          if-no-files-found: error

  image:
    # Build only, never push. PRP-09 keeps the image out of any registry: it would carry the
    # application but the deploy builds on VM-201 from the rsynced tree, and an image nobody
    # pulls is one more place a secret could end up.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cadence:ci
      - name: The image runs as uid 10001, not root
        run: test "$(docker run --rm --entrypoint id cadence:ci -u)" = "10001"
      - name: No .env was baked into any layer
        run: |
          if docker run --rm --entrypoint sh cadence:ci -c 'ls -a /app' | grep -qx '.env'; then
            echo "an .env file is present in the image" >&2
            exit 1
          fi
