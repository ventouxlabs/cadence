# docs/exercise-principles.md section 9.4 - Pull. Transcribed verbatim.
# The three `requires_anchor` movements are filtered out of every session when the profile has no
# overhead anchor (section 1.7); db-floor-pullover and bench-supported-db-row are their stand-ins.
