# docs/exercise-principles.md section 10.2 - `upper-a`, adult, day type upper_a.
# Prescriptions are block week 1; section 6.2 scales weeks 2-4. Rows are in priority order and
# the engine truncates to the session-length row count (section 6.4), appending from `extras`
# at 45 min. Week-1 values here beat the canonical week-1 shape of section 6.2 (P7) - the plank
# is 3 x 40 s, not 3 x 30 s.
version: 1
kind: workout
id: upper-a
name: Upper A
day_type: upper_a
target_profile_kind: adult
variant: null
prelude: posture-prelude-v1
rows:
  - exercise: db-bench-press
    role: main
    sets: 3
    reps: 8
    rest_s: 90
    rpe_target: 8
    load_rule: { mode: ladder, pct_of_heaviest: 0.55 }

  - exercise: db-bent-row
    role: secondary
    sets: 3
    reps: 8
    rest_s: 90
    rpe_target: 8
    # "match press load +/- 1 rung"
    load_rule:
      { mode: ladder, relative_to: db-bench-press, pct: 1.0, rung_tolerance: 1 }

  - exercise: db-overhead-press
    role: secondary
    sets: 3
    reps: 10
    rest_s: 60
    load_rule: { mode: ladder, relative_to: db-bench-press, pct: 0.6 }

  - exercise: prone-ytw-raise
    role: secondary
    sets: 2
    reps: 10
    rest_s: 45
    load_rule: { mode: bodyweight }

  - exercise: plank
    role: finisher
    sets: 3
    seconds: 40
    rest_s: 45
    load_rule: { mode: bodyweight }
extras:
  - exercise: db-lateral-raise
    role: secondary
    sets: 2
    reps: 12
    rest_s: 45
    load_rule: { mode: ladder, pct_of_heaviest: 0.15 }

  - exercise: db-rear-delt-raise
    role: secondary
    sets: 2
    reps: 12
    rest_s: 45
    load_rule: { mode: ladder, pct_of_heaviest: 0.15 }
