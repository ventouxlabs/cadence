# docs/exercise-principles.md section 10.4 - `upper-b`, adult, day type upper_b.
# Row 4 keeps the day's vertical-pull slot: db-floor-pullover without an overhead anchor,
# scap-pull-hang 3 x 8 with one (`anchor_alt`, D-056). inverted-row is an extras option, never a
# slot-4 swap, and is filtered out entirely when there is no anchor (section 1.7).
version: 1
kind: workout
id: upper-b
name: Upper B
day_type: upper_b
target_profile_kind: adult
variant: null
prelude: posture-prelude-v1
rows:
  - exercise: push-up
    role: main
    sets: 3
    reps: 12
    rest_s: 90
    rpe_target: 8
    cue_override: Squeeze glutes, ribs down, two reps in reserve - never to failure.
    load_rule: { mode: bodyweight }

  - exercise: bench-supported-db-row
    role: secondary
    sets: 3
    reps: 10
    rest_s: 90
    rpe_target: 8
    load_rule: { mode: ladder, pct_of_heaviest: 0.45 }

  - exercise: db-floor-press
    role: secondary
    sets: 3
    reps: 10
    rest_s: 60
    load_rule: { mode: ladder, pct_of_heaviest: 0.45 }

  - exercise: db-floor-pullover
    role: secondary
    sets: 2
    reps: 12
    rest_s: 60
    load_rule: { mode: ladder, pct_of_heaviest: 0.3 }
    anchor_alt: { exercise: scap-pull-hang, sets: 3, reps: 8, load_rule: { mode: bodyweight } }

  - exercise: hollow-hold
    role: finisher
    sets: 3
    seconds: 30
    rest_s: 45
    load_rule: { mode: bodyweight }
extras:
  - exercise: db-rear-delt-raise
    role: secondary
    sets: 2
    reps: 12
    rest_s: 45
    load_rule: { mode: ladder, pct_of_heaviest: 0.15 }

  - exercise: scap-push-up
    role: secondary
    sets: 2
    reps: 10
    rest_s: 30
    load_rule: { mode: bodyweight }

  - exercise: inverted-row
    role: secondary
    sets: 2
    reps: 8
    rest_s: 60
    load_rule: { mode: bodyweight }
